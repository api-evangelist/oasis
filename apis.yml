aid: oasis
name: Oasis
description: >-
  Oasis Security is a Non-Human Identity (NHI) management and security platform
  for hybrid and multi-cloud environments. Its Agentic Access Management (AAM)
  offering discovers, inventories, governs, and secures service accounts,
  service principals, managed identities, API keys, secrets, and AI agent
  credentials across AWS, Azure, GCP, Okta, HashiCorp, Snowflake, GitHub,
  Salesforce, and AI services such as OpenAI and Amazon Bedrock. The platform
  provides automated discovery and risk assessment, ownership and context
  mapping, posture management, threat detection and anomaly monitoring,
  policy-driven governance and remediation, time-bound provisioning, and secure
  secret rotation. Founded in New York and backed by Sequoia Capital, Accel,
  Cyberstarts, and Maple Venture Capital, Oasis extends zero-trust and PAM
  practices to the fast-growing population of non-human and agentic identities.
